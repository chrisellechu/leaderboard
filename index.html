<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Leaderboard (Live)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">

<!--
  ============================================================
  FIREBASE SETUP -- read this before deploying.

  This page needs a Firebase Realtime Database to sync across
  devices. Firebase's own client library can only be loaded from
  Google's CDN (there's no offline/bundled alternative), so unlike
  the escape-room games, THIS page requires an internet connection
  to work at all.

  Steps (one-time setup, takes about 10 minutes):
  1. Go to https://console.firebase.google.com and create a project
     (free tier is enough for this).
  2. In the project, go to Build > Realtime Database > Create Database.
     Choose any region, start in "test mode" for now.
  3. In Realtime Database > Rules, paste this and Publish:
       {
         "rules": {
           ".read": true,
           ".write": true
         }
       }
     (This is fully open -- fine for a low-stakes leaderboard game,
     not fine if you ever store anything sensitive here.)
  4. Go to Project Settings (gear icon) > General > scroll to
     "Your apps" > click the Web icon (</>) > register an app
     (nickname can be anything, no need for Hosting).
  5. Copy the firebaseConfig object it shows you and paste it over
     the FIREBASE_CONFIG placeholder in the <script> block below,
     replacing every "REPLACE_ME" value.
  ============================================================
-->

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>

<style>
  :root{
    --blue:#2F449C;
    --blue-deep:#233574;
    --blue-line: rgba(47,68,156,0.35);
    --white:#ffffff;
    --ink:#1c2a5e;
    --muted:#8b95c2;
    --success:#2f9e5c;
    --danger:#c0392b;
    --font-display: 'Fredoka', Arial, sans-serif;
    --font-body: Arial, "Helvetica Neue", Helvetica, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:var(--font-body);
    background:#eef0fa;
    min-height:100%;
    display:flex; align-items:center; justify-content:center;
    padding:3vh 3vw;
    color:var(--ink);
  }
  button{font-family:var(--font-body); cursor:pointer;}

  .wrap{ width:100%; max-width:760px; }

  /* ===== CONNECTION STATUS ===== */
  .conn-status{
    text-align:center; font-size:11.5px; font-weight:700; margin-bottom:8px;
    letter-spacing:.04em; text-transform:uppercase;
  }
  .conn-status.connecting{ color:var(--muted); }
  .conn-status.live{ color:var(--success); }
  .conn-status.error{ color:var(--danger); }
  .conn-dot{ display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:5px; }
  .conn-status.connecting .conn-dot{ background:var(--muted); animation:pulseDot 1.2s ease-in-out infinite; }
  .conn-status.live .conn-dot{ background:var(--success); }
  .conn-status.error .conn-dot{ background:var(--danger); }
  @keyframes pulseDot{ 0%,100%{opacity:.4;} 50%{opacity:1;} }

  /* ===== LEADERBOARD VIEW ===== */
  .lb-toolbar{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:14px; gap:10px; flex-wrap:wrap;
  }
  .lb-title{
    font-family:var(--font-display); font-weight:700; color:var(--blue-deep);
    font-size:clamp(20px,3.4vw,28px); letter-spacing:.02em;
  }
  .btn-primary{
    background:var(--blue); color:#fff; border:none; border-radius:40px;
    padding:12px 26px; font-size:15px; font-weight:700; letter-spacing:.02em;
    box-shadow:0 4px 14px rgba(47,68,156,0.3); transition:transform .15s,filter .15s;
  }
  .btn-primary:hover{ filter:brightness(1.08); }
  .btn-primary:active{ transform:scale(0.97); }
  .btn-primary:disabled{ opacity:.5; cursor:not-allowed; }

  .board{
    background:#fff; border:3px solid var(--blue); border-radius:16px;
    overflow:hidden; box-shadow:0 10px 30px rgba(35,53,116,0.15);
  }
  .board-header{
    background:var(--blue); color:#fff;
    display:grid; grid-template-columns:90px 1fr 130px;
  }
  .board-header div{
    font-family:var(--font-display); font-weight:600; letter-spacing:.06em;
    text-transform:uppercase; font-size:clamp(13px,2vw,17px);
    padding:14px 10px; text-align:center;
  }
  .board-header div:nth-child(2){ text-align:left; padding-left:22px; }

  .board-rows{ max-height:56vh; overflow-y:auto; }
  .row{
    display:grid; grid-template-columns:90px 1fr 130px;
    border-bottom:1.5px solid var(--blue-line);
    transition:background .3s ease;
  }
  .row:last-child{ border-bottom:none; }
  .row.filled{ animation:rowIn .4s ease; }
  @keyframes rowIn{ from{background:#fff4d6;} to{background:transparent;} }
  .row.top1{ background:rgba(255,209,102,0.28); }
  .row.top2{ background:rgba(200,210,240,0.35); }
  .row.top3{ background:rgba(224,180,140,0.22); }

  .cell{ padding:12px 10px; font-size:clamp(13px,2vw,16px); display:flex; align-items:center; }
  .cell.place{ justify-content:center; font-family:var(--font-display); font-weight:700; color:var(--blue-deep); }
  .cell.team{ padding-left:22px; font-weight:600; word-break:break-word; }
  .cell.time{ justify-content:center; font-variant-numeric:tabular-nums; font-weight:700; color:var(--blue); }
  .cell.empty-cell{ color:var(--muted); }
  .medal{ font-size:18px; margin-right:6px; }

  /* ===== ENTRY FORM VIEW ===== */
  .lb-view.hidden{ display:none; }
  .form-screen{ display:none; }
  .form-screen.active{ display:block; }

  .form-card{
    background:#fff; border:3px solid var(--blue); border-radius:20px;
    padding:32px 28px; max-width:420px; margin:0 auto;
    box-shadow:0 12px 34px rgba(35,53,116,0.18);
  }
  .form-title{
    font-family:var(--font-display); font-weight:700; color:var(--blue-deep);
    font-size:clamp(20px,3.6vw,26px); text-align:center; margin-bottom:6px;
  }
  .form-sub{ text-align:center; color:var(--muted); font-size:13px; margin-bottom:26px; }
  .field{ margin-bottom:20px; }
  .field label{
    display:block; font-size:12px; font-weight:700; letter-spacing:.06em;
    text-transform:uppercase; color:var(--blue); margin-bottom:6px;
  }
  .field input[type=text]{
    width:100%; padding:13px 14px; font-size:17px; border:2px solid #d6dcf2;
    border-radius:10px; font-family:var(--font-body); color:var(--ink);
  }
  .field input[type=text]:focus{ outline:none; border-color:var(--blue); }
  .time-row{ display:flex; align-items:center; gap:10px; }
  .time-row .time-input-wrap{ flex:1; text-align:center; }
  .time-row input[type=number]{
    width:100%; padding:13px 8px; font-size:22px; text-align:center; border:2px solid #d6dcf2;
    border-radius:10px; font-family:var(--font-body); font-weight:700; color:var(--ink);
    -moz-appearance:textfield;
  }
  .time-row input[type=number]::-webkit-outer-spin-button,
  .time-row input[type=number]::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
  .time-row input[type=number]:focus{ outline:none; border-color:var(--blue); }
  .time-row .time-unit{ font-size:11px; color:var(--muted); margin-top:4px; text-transform:uppercase; letter-spacing:.05em; }
  .time-row .colon{ font-family:var(--font-display); font-weight:700; font-size:24px; color:var(--blue); padding-bottom:16px; }

  .form-err{ color:var(--danger); font-size:12.5px; text-align:center; min-height:16px; margin-bottom:8px; }
  .form-actions{ display:flex; gap:10px; margin-top:6px; }
  .btn-cancel{
    flex:0 0 100px; background:#eef0fa; color:var(--ink); border:none; border-radius:40px;
    padding:12px; font-size:14px; font-weight:700;
  }
  .btn-submit{
    flex:1; background:var(--blue); color:#fff; border:none; border-radius:40px;
    padding:12px; font-size:15px; font-weight:700;
  }
  .btn-submit:hover{ filter:brightness(1.08); }
  .btn-submit:disabled{ opacity:.5; cursor:not-allowed; }

  .confirm-banner{
    display:none; text-align:center; background:var(--success); color:#fff;
    font-weight:700; font-size:14px; padding:10px 16px; border-radius:10px; margin-bottom:14px;
  }
  .confirm-banner.show{ display:block; animation:rowIn .5s ease; }

  /* ===== ADMIN ===== */
  .admin-gear{
    position:fixed; bottom:10px; right:10px; z-index:500;
    width:32px; height:32px; border-radius:50%; border:none;
    background:rgba(35,53,116,0.35); color:#fff; font-size:15px;
    display:none; align-items:center; justify-content:center;
  }
  .admin-overlay{
    display:none; position:fixed; inset:0; z-index:999; background:rgba(20,25,60,0.55);
    align-items:center; justify-content:center; padding:20px;
  }
  .admin-overlay.show{ display:flex; }
  .admin-pin-box{ background:#fff; border-radius:14px; padding:24px 26px; max-width:260px; width:100%; text-align:center; }
  .admin-pin-box h3{ margin:0 0 10px 0; color:var(--blue-deep); font-family:var(--font-display); }
  .admin-pin-box input{
    width:100%; padding:10px; font-size:20px; text-align:center; letter-spacing:.3em;
    border:1px solid #ccc; border-radius:8px; margin-bottom:10px;
  }
  .admin-pin-box button{ width:100%; padding:9px; border:none; border-radius:8px; background:var(--blue); color:#fff; font-weight:700; }
  .admin-pin-err{ color:var(--danger); font-size:11px; min-height:14px; margin-bottom:4px; }

  .admin-panel{
    background:#fff; border-radius:14px; max-width:600px; width:100%; max-height:88vh; overflow-y:auto;
    padding:22px 24px; text-align:left;
  }
  .admin-panel h2{ margin:0 0 4px 0; color:var(--blue-deep); font-family:var(--font-display); }
  .admin-panel .note{ font-size:12px; color:#888; margin:0 0 16px 0; line-height:1.5; }
  .admin-field{ margin-bottom:10px; }
  .admin-field label{ display:block; font-size:11px; font-weight:700; color:#555; margin-bottom:2px; }
  .admin-field input[type=text]{ width:100%; padding:7px 9px; font-size:13px; border:1px solid #ddd; border-radius:6px; font-family:var(--font-body); }
  .admin-row-entry{
    display:flex; gap:6px; align-items:center; border:1px solid #eee; border-radius:8px; padding:7px 8px; margin-bottom:6px;
  }
  .admin-row-entry input[type=text]{ flex:2; padding:6px 8px; font-size:12.5px; border:1px solid #ddd; border-radius:5px; }
  .admin-row-entry input[type=number]{ flex:0 0 48px; padding:6px 4px; font-size:12.5px; border:1px solid #ddd; border-radius:5px; text-align:center; }
  .admin-row-entry .rm-btn{ flex:0 0 auto; background:#fde2e2; color:#a02020; border:none; border-radius:5px; padding:6px 9px; font-size:11px; font-weight:700; }
  .admin-actions{ display:flex; gap:8px; margin-top:14px; }
  .admin-actions button{ flex:1; padding:10px; border-radius:7px; border:none; font-weight:800; font-size:13px; }
  .btn-aa{ background:var(--blue); color:#fff; }
  .btn-ares{ background:#e6552e; color:#fff; }
  .btn-ac{ background:#eee; color:#333; flex:0 0 80px; }

  @media(max-width:480px){
    .board-header{ grid-template-columns:60px 1fr 100px; }
    .row{ grid-template-columns:60px 1fr 100px; }
  }
</style>
</head>
<body>

<button class="admin-gear" id="admin-gear">&#9881;</button>
<div class="admin-overlay" id="admin-overlay"></div>

<div class="wrap">

  <div class="conn-status connecting" id="conn-status"><span class="conn-dot"></span>Connecting…</div>

  <!-- ===== LEADERBOARD VIEW ===== -->
  <div class="lb-view" id="lb-view">
    <div class="confirm-banner" id="confirm-banner"></div>
    <div class="lb-toolbar">
      <div class="lb-title" id="lb-title">LEADERBOARD</div>
      <button class="btn-primary" id="btn-open-form" disabled>+ Enter Your Time</button>
    </div>
    <div class="board">
      <div class="board-header">
        <div id="col-place">Place</div>
        <div id="col-team">Team</div>
        <div id="col-time">Time</div>
      </div>
      <div class="board-rows" id="board-rows"></div>
    </div>
  </div>

  <!-- ===== ENTRY FORM VIEW ===== -->
  <div class="form-screen" id="form-screen">
    <div class="form-card">
      <div class="form-title">Add Your Result</div>
      <div class="form-sub">Enter your team name and completion time.</div>
      <div class="form-err" id="form-err"></div>
      <div class="field">
        <label>Team Name</label>
        <input type="text" id="f-team" maxlength="30" placeholder="e.g. The Molecule Menders" autocomplete="off">
      </div>
      <div class="field">
        <label>Completion Time</label>
        <div class="time-row">
          <div class="time-input-wrap">
            <input type="number" id="f-min" min="0" max="59" placeholder="00">
            <div class="time-unit">Minutes</div>
          </div>
          <div class="colon">:</div>
          <div class="time-input-wrap">
            <input type="number" id="f-sec" min="0" max="59" placeholder="00">
            <div class="time-unit">Seconds</div>
          </div>
        </div>
      </div>
      <div class="form-actions">
        <button class="btn-cancel" id="btn-cancel">Cancel</button>
        <button class="btn-submit" id="btn-submit">Add to Leaderboard</button>
      </div>
    </div>
  </div>

</div>

<script>
'use strict';

/* ================================================================
   FIREBASE CONFIG -- replace with your own project's values
   (Firebase Console > Project Settings > General > Your apps).
   The page will show a connection error banner until this is filled
   in with real values.
   ================================================================ */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDm0WC9JWfPlb2JNZ7Hb7pGUHnUM9OLFa4",
  authDomain: "virtual-sosme-leaderboard.firebaseapp.com",
  databaseURL: "https://virtual-sosme-leaderboard-default-rtdb.firebaseio.com",
  projectId: "virtual-sosme-leaderboard",
  storageBucket: "virtual-sosme-leaderboard.firebasestorage.appspot.com",
  messagingSenderId: "840435356293",
  appId: "1:840435356293:web:78fa7fe1f48717c03d4fec"
};

const CFG_DEFAULT = {
  title: "LEADERBOARD",
  columnPlace: "Place",
  columnTeam: "Team",
  columnTime: "Time",
  minRows: 12,
  adminPin: "1000",
  sortDirection: "asc",
  showGear: true
};

let CFG = {...CFG_DEFAULT};
let entries = [];
let db = null;
let isConnected = false;

/* ================================================================
   FIREBASE INIT
   ================================================================ */
function initFirebase(){
  const statusEl = document.getElementById('conn-status');
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.database();

    // Firebase's own "am I actually connected" signal
    db.ref('.info/connected').on('value', (snap) => {
      if(snap.val() === true){
        isConnected = true;
        statusEl.className = 'conn-status live';
        statusEl.innerHTML = '<span class="conn-dot"></span>Live';
        document.getElementById('btn-open-form').disabled = false;
      } else {
        isConnected = false;
        statusEl.className = 'conn-status connecting';
        statusEl.innerHTML = '<span class="conn-dot"></span>Reconnecting…';
        document.getElementById('btn-open-form').disabled = true;
      }
    });

    db.ref('config').on('value', (snap) => {
      CFG = Object.assign({}, CFG_DEFAULT, snap.val() || {});
      renderLeaderboard();
    }, (err) => showConnError(err));

    db.ref('entries').on('value', (snap) => {
      entries = [];
      snap.forEach(child => {
        entries.push({ id: child.key, ...child.val() });
      });
      renderLeaderboard();
    }, (err) => showConnError(err));

  }catch(err){
    showConnError(err);
  }
}

function showConnError(err){
  const statusEl = document.getElementById('conn-status');
  statusEl.className = 'conn-status error';
  statusEl.innerHTML = '<span class="conn-dot"></span>Connection error — check FIREBASE_CONFIG and database rules';
  console.error('Firebase error:', err);
}

/* ================================================================
   RENDER LEADERBOARD
   ================================================================ */
function fmtTime(totalSeconds){
  const m = Math.floor(totalSeconds/60);
  const s = totalSeconds%60;
  return `${m}:${String(s).padStart(2,'0')}`;
}
function sortedEntries(){
  const dir = CFG.sortDirection === 'desc' ? -1 : 1;
  return [...entries].sort((a,b)=> dir*(a.totalSeconds - b.totalSeconds));
}
function escapeHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderLeaderboard(justAddedId){
  document.getElementById('lb-title').textContent = CFG.title;
  document.getElementById('col-place').textContent = CFG.columnPlace;
  document.getElementById('col-team').textContent = CFG.columnTeam;
  document.getElementById('col-time').textContent = CFG.columnTime;
  if(CFG.showGear) document.getElementById('admin-gear').style.display = 'flex';

  const rowsEl = document.getElementById('board-rows');
  rowsEl.innerHTML = '';
  const ranked = sortedEntries();
  const rowCount = Math.max(ranked.length, CFG.minRows);

  for(let i=0;i<rowCount;i++){
    const e = ranked[i];
    const row = document.createElement('div');
    row.className = 'row';
    if(i===0 && e) row.classList.add('top1');
    else if(i===1 && e) row.classList.add('top2');
    else if(i===2 && e) row.classList.add('top3');
    if(e && e.id===justAddedId) row.classList.add('filled');

    const medal = i===0?'🥇':i===1?'🥈':i===2?'🥉':'';
    row.innerHTML = e ? `
      <div class="cell place">${medal?`<span class="medal">${medal}</span>`:''}${i+1}</div>
      <div class="cell team">${escapeHtml(e.team)}</div>
      <div class="cell time">${fmtTime(e.totalSeconds)}</div>
    ` : `
      <div class="cell place empty-cell">${i+1}</div>
      <div class="cell team empty-cell"></div>
      <div class="cell time empty-cell"></div>
    `;
    rowsEl.appendChild(row);
  }
}

/* ================================================================
   FORM VIEW
   ================================================================ */
const lbView = document.getElementById('lb-view');
const formScreen = document.getElementById('form-screen');

function openForm(){
  if(!isConnected) return;
  document.getElementById('f-team').value='';
  document.getElementById('f-min').value='';
  document.getElementById('f-sec').value='';
  document.getElementById('form-err').textContent='';
  lbView.classList.add('hidden');
  formScreen.classList.add('active');
  setTimeout(()=>document.getElementById('f-team').focus(),50);
}
function closeForm(){
  lbView.classList.remove('hidden');
  formScreen.classList.remove('active');
}

document.getElementById('btn-open-form').addEventListener('click', openForm);
document.getElementById('btn-cancel').addEventListener('click', closeForm);
document.getElementById('btn-submit').addEventListener('click', submitEntry);
[document.getElementById('f-team'), document.getElementById('f-min'), document.getElementById('f-sec')].forEach(el=>{
  el.addEventListener('keydown', e=>{ if(e.key==='Enter') submitEntry(); });
});

function submitEntry(){
  const team = document.getElementById('f-team').value.trim();
  const min = parseInt(document.getElementById('f-min').value, 10);
  const sec = parseInt(document.getElementById('f-sec').value, 10);
  const errEl = document.getElementById('form-err');

  if(!isConnected){ errEl.textContent = 'Not connected yet — please wait a moment and try again.'; return; }
  if(!team){ errEl.textContent = 'Please enter a team name.'; return; }
  if(isNaN(min) && isNaN(sec)){ errEl.textContent = 'Please enter a completion time.'; return; }
  const m = isNaN(min)?0:Math.max(0,min);
  const s = isNaN(sec)?0:Math.max(0,Math.min(59,sec));
  const totalSeconds = m*60+s;
  if(totalSeconds<=0){ errEl.textContent = 'Time must be greater than zero.'; return; }

  const submitBtn = document.getElementById('btn-submit');
  submitBtn.disabled = true;

  db.ref('entries').push({ team, totalSeconds, timestamp: Date.now() })
    .then((ref) => {
      submitBtn.disabled = false;
      closeForm();
      showConfirm(team, ref.key);
    })
    .catch((err) => {
      submitBtn.disabled = false;
      errEl.textContent = 'Could not save — check your connection and try again.';
      console.error(err);
    });
}

function showConfirm(team, newId){
  const ranked = sortedEntries();
  const place = ranked.findIndex(e=>e.id===newId)+1;
  const banner = document.getElementById('confirm-banner');
  banner.textContent = place > 0 ? `Added! ${team} is in place ${place}.` : `Added, ${team}!`;
  banner.classList.add('show');
  clearTimeout(showConfirm._t);
  showConfirm._t = setTimeout(()=>banner.classList.remove('show'), 3200);
}

/* ================================================================
   ADMIN MODE
   A client-side PIN like this offers only basic deterrence against
   casual participants opening the panel -- it is NOT secure
   authentication, and since the database rules in the setup
   instructions are wide open, anyone who inspects this page's
   network traffic could write to the database directly regardless
   of this PIN. Fine for a low-stakes exhibit leaderboard; do not
   reuse this pattern for anything sensitive.
   ================================================================ */
const adminGear = document.getElementById('admin-gear');
const adminOv = document.getElementById('admin-overlay');

adminGear.addEventListener('click', openAdminPin);
document.addEventListener('keydown', e=>{
  if(e.ctrlKey && e.shiftKey && (e.key==='A'||e.key==='a')){ e.preventDefault(); openAdminPin(); }
});

function openAdminPin(){
  adminOv.classList.add('show');
  adminOv.innerHTML = `
    <div class="admin-pin-box">
      <h3>Admin Mode</h3>
      <div class="admin-pin-err" id="ap-err"></div>
      <input type="password" id="ap-in" inputmode="numeric" maxlength="8" placeholder="PIN" autofocus>
      <button id="ap-btn">Unlock</button>
    </div>`;
  document.getElementById('ap-btn').onclick = checkPin;
  document.getElementById('ap-in').onkeydown = e=>{ if(e.key==='Enter') checkPin(); };
  adminOv.onclick = e=>{ if(e.target===adminOv) adminOv.classList.remove('show'); };
  setTimeout(()=>document.getElementById('ap-in').focus(),50);
}
function checkPin(){
  if(document.getElementById('ap-in').value === CFG.adminPin) renderAdminPanel();
  else document.getElementById('ap-err').textContent = 'Incorrect PIN.';
}

function ea(s){ return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

function renderAdminPanel(){
  const ranked = sortedEntries();
  adminOv.innerHTML = `
    <div class="admin-panel">
      <h2>Admin Panel — Leaderboard</h2>
      <p class="note">Edit any entry's team name or time, remove entries, or reset the whole board. Changes save to Firebase immediately and appear on every connected device within moments.</p>

      <div class="admin-field"><label>Board title</label><input type="text" id="af-title" value="${ea(CFG.title)}"></div>
      <div style="display:flex;gap:8px;">
        <div class="admin-field" style="flex:1;"><label>Column 1 label</label><input type="text" id="af-c1" value="${ea(CFG.columnPlace)}"></div>
        <div class="admin-field" style="flex:1;"><label>Column 2 label</label><input type="text" id="af-c2" value="${ea(CFG.columnTeam)}"></div>
        <div class="admin-field" style="flex:1;"><label>Column 3 label</label><input type="text" id="af-c3" value="${ea(CFG.columnTime)}"></div>
      </div>
      <div class="admin-field"><label>Admin PIN</label><input type="text" id="af-pin" value="${ea(CFG.adminPin)}"></div>

      <div class="admin-field" style="margin-top:16px;"><label>Entries (ranked order)</label></div>
      <div id="admin-entries"></div>

      <div class="admin-actions">
        <button class="btn-aa" id="aa-apply">Save Changes</button>
        <button class="btn-ares" id="aa-reset">Reset Leaderboard</button>
        <button class="btn-ac" id="aa-close">Close</button>
      </div>
    </div>`;

  const list = document.getElementById('admin-entries');
  ranked.forEach(e=>{
    const row = document.createElement('div');
    row.className = 'admin-row-entry';
    const m = Math.floor(e.totalSeconds/60), s = e.totalSeconds%60;
    row.innerHTML = `
      <input type="text" data-id="${e.id}" data-field="team" value="${ea(e.team)}">
      <input type="number" data-id="${e.id}" data-field="min" value="${m}" min="0">
      <span style="font-size:12px;color:#888;">m</span>
      <input type="number" data-id="${e.id}" data-field="sec" value="${s}" min="0" max="59">
      <span style="font-size:12px;color:#888;">s</span>
      <button class="rm-btn" data-rm="${e.id}">Remove</button>`;
    list.appendChild(row);
  });
  list.querySelectorAll('[data-rm]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      db.ref('entries/'+btn.dataset.rm).remove();
    });
  });

  document.getElementById('aa-apply').addEventListener('click', applyAdminEdits);
  document.getElementById('aa-reset').addEventListener('click', ()=>{
    if(confirm('Reset the leaderboard? This removes every entry for everyone, on every device.')){
      db.ref('entries').remove();
      adminOv.classList.remove('show');
    }
  });
  document.getElementById('aa-close').addEventListener('click', ()=>adminOv.classList.remove('show'));
}

function applyAdminEdits(){
  const newConfig = {
    title: document.getElementById('af-title').value || 'LEADERBOARD',
    columnPlace: document.getElementById('af-c1').value || 'Place',
    columnTeam: document.getElementById('af-c2').value || 'Team',
    columnTime: document.getElementById('af-c3').value || 'Time',
    adminPin: document.getElementById('af-pin').value || CFG_DEFAULT.adminPin
  };
  db.ref('config').update(newConfig);

  const updates = {};
  document.querySelectorAll('#admin-entries .admin-row-entry').forEach(row=>{
    const id = row.querySelector('[data-field="team"]').dataset.id;
    const team = row.querySelector('[data-field="team"]').value.trim();
    const min = parseInt(row.querySelector('[data-field="min"]').value,10) || 0;
    const sec = Math.max(0,Math.min(59, parseInt(row.querySelector('[data-field="sec"]').value,10) || 0));
    updates[id] = { team, totalSeconds: min*60+sec };
  });
  Object.keys(updates).forEach(id=>{
    db.ref('entries/'+id).update(updates[id]);
  });

  adminOv.classList.remove('show');
}

/* ================================================================
   INIT
   ================================================================ */
renderLeaderboard();
initFirebase();
</script>
</body>
</html>
